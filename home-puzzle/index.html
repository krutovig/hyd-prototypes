<meta charset="utf-8">
<title>HYD Home Puzzle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --table: #ffffff;
    --ink: #3b2f2a;
    --muted: #8a7a70;
    --btn: #f3ece6;
    --btn-ink: #3b2f2a;
    --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --inv-scale: 0.4;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--table); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 12px; align-items: flex-end; justify-content: space-between;
    pointer-events: none; font-size: 14px;
  }
  .hud > * { pointer-events: auto; }
  .heading { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
  #status { color: var(--muted); min-width: 0; min-height: 1.3em; }
  button {
    font: inherit; font-weight: 600; color: var(--btn-ink); background: var(--btn);
    border: 1px solid #e2d6cc; border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }

  #inventory { position: fixed; left: 50%; top: 0; width: 0; height: 0; z-index: 2; }
  #inventory .plate {
    position: absolute; left: -1090.5px; top: -43.5px; width: 2181px; height: 409px;
    background: url(assets/inv/Inventory_plate.png) center / 100% 100% no-repeat;
    transform: scale(var(--inv-scale)); transform-origin: 1090.5px 43.5px;
  }
  .inv-slot {
    position: absolute; width: 192px; height: 192px; padding: 0; border: 0; border-radius: 0;
    background: url(assets/inv/slot_btn.png) center / 100% 100% no-repeat;
    display: grid; place-items: center; cursor: pointer;
  }
  .inv-slot:focus-visible { outline: 6px solid var(--ink); outline-offset: 4px; }
  .inv-slot .sel {
    position: absolute; left: -9.5px; top: -9.5px; width: 211px; height: 211px; pointer-events: none;
    background: url(assets/inv/slot_btn_selected.png) center / 100% 100% no-repeat; display: none;
  }
  .inv-slot.selected .sel { display: block; }
  .inv-item {
    position: relative; pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6);
  }
  .inv-item.pop { transform: scale(0); transition: none; }
  .inv-item.held {
    position: fixed; z-index: 5; opacity: 0.45; transition: none;
    transform: translate(-50%, -50%) scale(calc(var(--inv-scale) * 1.4));
  }
  .inv-item.held.hot {
    opacity: 1;
    filter: drop-shadow(0 0 0 #fff) drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 0 3px #000);
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap">

<canvas id="stage"></canvas>
<div id="inventory" aria-label="Inventory"></div>
<div class="hud">
  <div class="heading">
    <h1>Home puzzle: click-to-move and the original inventory</h1>
    <span id="status"></span>
  </div>
  <button id="reset" type="button">Restart</button>
</div>
<div id="loading">Loading…</div>

<script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-webgl@4.1.56/dist/iife/spine-webgl.js"></script>
<script src="game.js"></script>
